name: Render Video
on:
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Unzip project
        run: unzip -q andes-miracle-video.zip
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2 ffmpeg
      - name: Install packages
        working-directory: andes
        run: npm install
      - name: Render
        working-directory: andes
        run: npx remotion render AndesVideo out/andes.mp4 --concurrency=2
      - uses: actions/upload-artifact@v4
        with:
          name: andes-video
          path: andes/out/andes.mp4
